name: Validate Knowledge Base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate GitHub-reading corpus, links, privacy, and visual assets
        run: python scripts/validate_repository.py
      - name: Verify deterministic catalog is committed
        run: git diff --exit-code -- CATALOG.md
