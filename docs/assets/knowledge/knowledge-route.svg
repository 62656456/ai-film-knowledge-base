<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AI影视公开知识路线</title><desc id="desc">公开知识库由三个可以独立阅读的层组成：A理论解释为什么，B实践解释怎么做，C审核与验收解释何时退回和凭什么通过。读者可只拿一张卡或走完整路线。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37a6b5"/></marker></defs>
  <style>.bg{fill:#11181c}.paper{fill:#f6f0e5;stroke:#b9aa91;stroke-width:2}.c{fill:#1d282e;stroke:#d94b3d;stroke-width:3}.letter{font:700 42px Georgia,serif;fill:#f0643b}.h{font:700 25px Arial,"Microsoft YaHei",sans-serif;fill:#182025}.hc{font:700 25px Arial,"Microsoft YaHei",sans-serif;fill:#f6f0e5}.p{font:500 16px Arial,"Microsoft YaHei",sans-serif;fill:#526169}.pc{font:500 16px Arial,"Microsoft YaHei",sans-serif;fill:#c8d2d6}.foot{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#f6f0e5}</style>
  <rect class="bg" width="1200" height="500" rx="24"/><path d="M120 240H1080" stroke="#37a6b5" stroke-width="6" marker-end="url(#a)"/>
  <g transform="translate(65 105)"><rect class="paper" width="300" height="245" rx="12"/><text x="32" y="62" class="letter">A</text><text x="150" y="103" text-anchor="middle" class="h">理论｜为什么</text><text x="150" y="145" text-anchor="middle" class="p">摄影 · 导演 · 编剧</text><text x="150" y="177" text-anchor="middle" class="p">机制 · 因果 · 边界</text></g>
  <g transform="translate(450 105)"><rect class="paper" width="300" height="245" rx="12"/><text x="32" y="62" class="letter">B</text><text x="150" y="103" text-anchor="middle" class="h">实践｜怎么做</text><text x="150" y="145" text-anchor="middle" class="p">分镜 · 提示词 · 平台</text><text x="150" y="177" text-anchor="middle" class="p">流程 · 模板 · 生产</text></g>
  <g transform="translate(835 105)"><rect class="c" width="300" height="245" rx="12"/><text x="32" y="62" class="letter">C</text><text x="150" y="103" text-anchor="middle" class="hc">验收｜何时通过</text><text x="150" y="145" text-anchor="middle" class="pc">状态 · 证据 · 退回</text><text x="150" y="177" text-anchor="middle" class="pc">审核 · 权利 · 发布</text></g>
  <text x="600" y="425" text-anchor="middle" class="foot">TAKE ONE NOTE｜FOLLOW THE WHOLE ROUTE｜READ DIRECTLY ON GITHUB</text>
</svg>
