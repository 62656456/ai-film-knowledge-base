<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI分镜调度双通道</title><desc id="desc">左侧俯视空间图记录世界坐标、门、人物、道具、摄影机和动作轴；右侧观众画面描述记录景别、横向位置、纵深、朝向、遮挡和动作变化。两者共同约束同一场戏。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f0643b"/></marker></defs>
  <style>.bg{fill:#11181c}.paper{fill:#f6f0e5;stroke:#b9aa91;stroke-width:2}.wall{stroke:#182025;stroke-width:12}.axis{stroke:#f0643b;stroke-width:3;stroke-dasharray:9 7}.cam{fill:#37a6b5}.a{fill:#d94b3d}.b{fill:#d6a756}.h{font:700 23px Arial,"Microsoft YaHei",sans-serif;fill:#182025}.p{font:500 16px Arial,"Microsoft YaHei",sans-serif;fill:#526169}.light{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#f6f0e5}</style>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <rect class="paper" x="45" y="65" width="510" height="420" rx="12"/><text x="300" y="105" text-anchor="middle" class="h">通道 A｜俯视空间真相</text><path d="M95 145H505V425H95Z" fill="none" class="wall"/><path d="M245 145V205" stroke="#f6f0e5" stroke-width="16"/><text x="220" y="178" class="p">门</text><circle class="a" cx="205" cy="285" r="28"/><text x="205" y="291" text-anchor="middle" class="light">A</text><circle class="b" cx="385" cy="300" r="28"/><text x="385" y="306" text-anchor="middle" class="light">B</text><polygon class="cam" points="285,405 335,385 335,425"/><path d="M325 405L300 325" stroke="#37a6b5" stroke-width="4" marker-end="url(#a)"/><path d="M130 250H470" class="axis"/><text x="120" y="240" class="p">动作轴</text>
  <rect class="paper" x="645" y="65" width="510" height="420" rx="12"/><text x="900" y="105" text-anchor="middle" class="h">通道 B｜观众可见结果</text><rect x="695" y="145" width="410" height="255" fill="#d8d2c7"/><rect x="695" y="315" width="410" height="85" fill="#9c9589"/><circle class="a" cx="815" cy="250" r="42"/><rect class="a" x="775" y="292" width="80" height="88" rx="18"/><circle class="b" cx="970" cy="270" r="34"/><rect class="b" x="938" y="305" width="64" height="75" rx="16"/><rect x="1035" y="145" width="36" height="255" fill="#182025" opacity=".7"/><text x="695" y="438" class="p">景别 → 左右 → 前中后景 → 朝向/视线</text><text x="695" y="466" class="p">距离/遮挡 → 谁动谁静 → 关系变化 → 禁止项</text>
  <text x="600" y="530" text-anchor="middle" class="light">A 负责世界坐标｜B 负责当前机位投影｜两者不能互相替代</text>
</svg>
