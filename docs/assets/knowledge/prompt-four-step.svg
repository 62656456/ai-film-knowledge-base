<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">提示词四步工作流</title><desc id="desc">流程从明确意图、拆解画面、组装提示词到检查真实输出。检查失败沿红色路径回到造成失败的字段；连续失败则回到意图。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37a6b5"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d94b3d"/></marker></defs>
  <style>.bg{fill:#11181c}.card{fill:#f6f0e5;stroke:#b9aa91;stroke-width:2}.check{fill:#1d282e;stroke:#4a626c;stroke-width:2}.n{font:700 16px Consolas,monospace;fill:#fff}.h{font:700 22px Arial,"Microsoft YaHei",sans-serif;fill:#182025}.hr{font:700 22px Arial,"Microsoft YaHei",sans-serif;fill:#f6f0e5}.p{font:500 15px Arial,"Microsoft YaHei",sans-serif;fill:#526169}.pr{font:500 15px Arial,"Microsoft YaHei",sans-serif;fill:#c8d2d6}.red{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#f07e72}</style>
  <rect class="bg" width="1200" height="470" rx="24"/><path d="M90 205H1110" stroke="#37a6b5" stroke-width="5" marker-end="url(#a)"/>
  <g transform="translate(60 105)"><rect class="card" width="245" height="170" rx="9"/><circle cx="32" cy="32" r="20" fill="#37a6b5"/><text x="32" y="38" text-anchor="middle" class="n">01</text><text x="122" y="78" text-anchor="middle" class="h">明确意图</text><text x="122" y="112" text-anchor="middle" class="p">用途 · 情绪 · 核心主体</text></g>
  <g transform="translate(335 105)"><rect class="card" width="245" height="170" rx="9"/><circle cx="32" cy="32" r="20" fill="#37a6b5"/><text x="32" y="38" text-anchor="middle" class="n">02</text><text x="122" y="78" text-anchor="middle" class="h">拆解画面</text><text x="122" y="112" text-anchor="middle" class="p">主体 · 动作 · 环境 · 光线</text></g>
  <g transform="translate(610 105)"><rect class="card" width="245" height="170" rx="9"/><circle cx="32" cy="32" r="20" fill="#f0643b"/><text x="32" y="38" text-anchor="middle" class="n">03</text><text x="122" y="78" text-anchor="middle" class="h">组装提示词</text><text x="122" y="112" text-anchor="middle" class="p">先主后次 · 去矛盾 · 控长度</text></g>
  <g transform="translate(885 105)"><rect class="check" width="245" height="170" rx="9"/><circle cx="32" cy="32" r="20" fill="#d94b3d"/><text x="32" y="38" text-anchor="middle" class="n">04</text><text x="122" y="78" text-anchor="middle" class="hr">检查真实输出</text><text x="122" y="112" text-anchor="middle" class="pr">主体 · 动作 · 光 · 构图 · 风格</text></g>
  <path d="M1005 295V365H455V295" fill="none" stroke="#d94b3d" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#r)"/><text x="730" y="410" text-anchor="middle" class="red">单项失败：回到对应字段｜多轮仍失败：回到意图和生成路线</text>
</svg>
