<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">八级景别合同</title><desc id="desc">八个画框从大远景到极特写，人物在画幅中的相对尺寸逐级增大。景别记录主体尺寸，不与建立镜头、正反打或慢动作等功能混淆。</desc>
  <style>.bg{fill:#11181c}.frame{fill:#f6f0e5;stroke:#b9aa91;stroke-width:2}.person{fill:#182025}.h{font:700 16px Arial,"Microsoft YaHei",sans-serif;fill:#182025}.k{font:700 15px Consolas,monospace;fill:#f0643b}.foot{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#f6f0e5}</style>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <g transform="translate(30 90)"><rect class="frame" width="135" height="300" rx="6"/><circle class="person" cx="68" cy="184" r="7"/><rect class="person" x="65" y="191" width="6" height="20"/><text x="68" y="330" text-anchor="middle" class="k">EWS / ELS</text><text x="68" y="355" text-anchor="middle" class="h">大远景</text></g>
  <g transform="translate(175 90)"><rect class="frame" width="135" height="300" rx="6"/><circle class="person" cx="68" cy="148" r="11"/><rect class="person" x="62" y="160" width="12" height="55"/><text x="68" y="330" text-anchor="middle" class="k">WS / LS</text><text x="68" y="355" text-anchor="middle" class="h">远景</text></g>
  <g transform="translate(320 90)"><rect class="frame" width="135" height="300" rx="6"/><circle class="person" cx="68" cy="105" r="16"/><rect class="person" x="58" y="122" width="20" height="105"/><text x="68" y="330" text-anchor="middle" class="k">FS</text><text x="68" y="355" text-anchor="middle" class="h">全景</text></g>
  <g transform="translate(465 90)"><rect class="frame" width="135" height="300" rx="6"/><circle class="person" cx="68" cy="75" r="21"/><rect class="person" x="52" y="98" width="32" height="140"/><text x="68" y="330" text-anchor="middle" class="k">MLS / MWS</text><text x="68" y="355" text-anchor="middle" class="h">中远景</text></g>
  <g transform="translate(610 90)"><rect class="frame" width="135" height="300" rx="6"/><circle class="person" cx="68" cy="61" r="27"/><rect class="person" x="44" y="90" width="48" height="170"/><text x="68" y="330" text-anchor="middle" class="k">MS</text><text x="68" y="355" text-anchor="middle" class="h">中景</text></g>
  <g transform="translate(755 90)"><rect class="frame" width="135" height="300" rx="6"/><circle class="person" cx="68" cy="60" r="36"/><rect class="person" x="30" y="98" width="76" height="180"/><text x="68" y="330" text-anchor="middle" class="k">MCU</text><text x="68" y="355" text-anchor="middle" class="h">中近景</text></g>
  <g transform="translate(900 90)"><rect class="frame" width="135" height="300" rx="6"/><circle class="person" cx="68" cy="92" r="58"/><rect class="person" x="12" y="152" width="112" height="128"/><text x="68" y="330" text-anchor="middle" class="k">CU</text><text x="68" y="355" text-anchor="middle" class="h">近景</text></g>
  <g transform="translate(1045 90)"><rect class="frame" width="125" height="300" rx="6"/><ellipse class="person" cx="62" cy="110" rx="76" ry="92"/><circle cx="62" cy="98" r="15" fill="#f6f0e5"/><text x="62" y="330" text-anchor="middle" class="k">ECU / XCU</text><text x="62" y="355" text-anchor="middle" class="h">极特写</text></g>
  <text x="600" y="500" text-anchor="middle" class="foot">主体尺寸逐级增大｜镜头功能、人数、机位关系与时间处理另行记录</text>
</svg>
