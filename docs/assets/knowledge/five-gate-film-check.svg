<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI影视五门验收</title><desc id="desc">五个连续检查门分别审核故事因果、空间连续、视觉物理、时间声音和交付证据。任一硬门失败都返回责任层。</desc>
  <style>.bg{fill:#11181c}.rail{stroke:#37a6b5;stroke-width:6}.gate{fill:#f6f0e5;stroke:#b9aa91;stroke-width:2}.num{font:700 17px Consolas,monospace;fill:#fff}.h{font:700 21px Arial,"Microsoft YaHei",sans-serif;fill:#182025}.p{font:500 14px Arial,"Microsoft YaHei",sans-serif;fill:#526169}.fail{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#f07e72}</style>
  <rect class="bg" width="1200" height="560" rx="24"/><path class="rail" d="M70 275H1130"/>
  <g transform="translate(40 160)"><rect class="gate" width="205" height="220" rx="10"/><circle cx="34" cy="34" r="21" fill="#f0643b"/><text x="34" y="40" text-anchor="middle" class="num">01</text><text x="102" y="82" text-anchor="middle" class="h">故事因果</text><text x="102" y="116" text-anchor="middle" class="p">目标 · 阻力 · 策略</text><text x="102" y="143" text-anchor="middle" class="p">刺激 · 选择 · 代价</text></g>
  <g transform="translate(270 160)"><rect class="gate" width="205" height="220" rx="10"/><circle cx="34" cy="34" r="21" fill="#37a6b5"/><text x="34" y="40" text-anchor="middle" class="num">02</text><text x="102" y="82" text-anchor="middle" class="h">空间连续</text><text x="102" y="116" text-anchor="middle" class="p">世界坐标 · 机位投影</text><text x="102" y="143" text-anchor="middle" class="p">动作 · 道具 · 光源</text></g>
  <g transform="translate(500 160)"><rect class="gate" width="205" height="220" rx="10"/><circle cx="34" cy="34" r="21" fill="#37a6b5"/><text x="34" y="40" text-anchor="middle" class="num">03</text><text x="102" y="82" text-anchor="middle" class="h">视觉物理</text><text x="102" y="116" text-anchor="middle" class="p">镜头功能 · 光色来源</text><text x="102" y="143" text-anchor="middle" class="p">材质 · 接触 · 重量</text></g>
  <g transform="translate(730 160)"><rect class="gate" width="205" height="220" rx="10"/><circle cx="34" cy="34" r="21" fill="#37a6b5"/><text x="34" y="40" text-anchor="middle" class="num">04</text><text x="102" y="82" text-anchor="middle" class="h">时间声音</text><text x="102" y="116" text-anchor="middle" class="p">时长闭合 · 剪辑动机</text><text x="102" y="143" text-anchor="middle" class="p">对白 · 动作 · 声音层</text></g>
  <g transform="translate(960 160)"><rect class="gate" width="205" height="220" rx="10"/><circle cx="34" cy="34" r="21" fill="#d94b3d"/><text x="34" y="40" text-anchor="middle" class="num">05</text><text x="102" y="82" text-anchor="middle" class="h">交付证据</text><text x="102" y="116" text-anchor="middle" class="p">可打开 · 可观看</text><text x="102" y="143" text-anchor="middle" class="p">版本 · 状态 · 权利</text></g>
  <text x="600" y="465" text-anchor="middle" class="fail">任一适用硬门 FAIL → 定向退回责任层；不靠“再生成一次”绕过</text>
</svg>
