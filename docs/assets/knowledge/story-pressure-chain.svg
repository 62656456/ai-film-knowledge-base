<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">结构压力链六节点</title><desc id="desc">六个节点从开场问题、一转折回不去、中段旧办法失效、二转折退路切断、高潮选择与代价，到结尾回收不解释，压力逐级升级。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37a6b5"/></marker></defs>
  <style>.bg{fill:#11181c}.card{fill:#f6f0e5;stroke:#b9aa91;stroke-width:2}.hot{fill:#d94b3d}.n{font:700 16px Consolas,monospace;fill:#fff}.h{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#182025}.p{font:500 14px Arial,"Microsoft YaHei",sans-serif;fill:#526169}.foot{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#f6f0e5}</style>
  <rect class="bg" width="1200" height="430" rx="24"/><path d="M75 220H1125" stroke="#37a6b5" stroke-width="5" marker-end="url(#a)"/>
  <g transform="translate(25 120)"><rect class="card" width="175" height="180" rx="8"/><circle cx="28" cy="28" r="18" fill="#37a6b5"/><text x="28" y="34" text-anchor="middle" class="n">01</text><text x="87" y="77" text-anchor="middle" class="h">开场｜问题</text><text x="87" y="112" text-anchor="middle" class="p">即将破裂的日常</text></g>
  <g transform="translate(220 120)"><rect class="card" width="175" height="180" rx="8"/><circle cx="28" cy="28" r="18" fill="#37a6b5"/><text x="28" y="34" text-anchor="middle" class="n">02</text><text x="87" y="77" text-anchor="middle" class="h">一转折｜回不去</text><text x="87" y="112" text-anchor="middle" class="p">目标/关系/代价改变</text></g>
  <g transform="translate(415 120)"><rect class="card" width="175" height="180" rx="8"/><circle cx="28" cy="28" r="18" fill="#f0643b"/><text x="28" y="34" text-anchor="middle" class="n">03</text><text x="87" y="77" text-anchor="middle" class="h">中段｜办法失效</text><text x="87" y="112" text-anchor="middle" class="p">被迫更换策略</text></g>
  <g transform="translate(610 120)"><rect class="card" width="175" height="180" rx="8"/><circle cx="28" cy="28" r="18" fill="#f0643b"/><text x="28" y="34" text-anchor="middle" class="n">04</text><text x="87" y="77" text-anchor="middle" class="h">二转折｜退路断</text><text x="87" y="112" text-anchor="middle" class="p">最坏选择成为唯一</text></g>
  <g transform="translate(805 120)"><rect class="hot" width="175" height="180" rx="8"/><circle cx="28" cy="28" r="18" fill="#182025"/><text x="28" y="34" text-anchor="middle" class="n">05</text><text x="87" y="77" text-anchor="middle" class="h" style="fill:#fff">高潮｜选择代价</text><text x="87" y="112" text-anchor="middle" class="p" style="fill:#fff">选 A，永久失去 B</text></g>
  <g transform="translate(1000 120)"><rect class="card" width="175" height="180" rx="8"/><circle cx="28" cy="28" r="18" fill="#37a6b5"/><text x="28" y="34" text-anchor="middle" class="n">06</text><text x="87" y="77" text-anchor="middle" class="h">结尾｜回收</text><text x="87" y="112" text-anchor="middle" class="p">回响，不新增解释</text></g>
  <text x="600" y="370" text-anchor="middle" class="foot">升级不是“又发生一件事”，而是旧办法失效、策略改变、代价上升</text>
</svg>
