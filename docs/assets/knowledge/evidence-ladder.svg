<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">状态与证据阶梯</title><desc id="desc">四级阶梯从结构证据上升到内容证据、真实运行或视觉证据、审核者接受证据。每一级只证明本级事实。</desc>
  <style>.bg{fill:#11181c}.paper{fill:#f6f0e5}.line{stroke:#37a6b5;stroke-width:5}.step{fill:#1b252b;stroke:#45616a;stroke-width:2}.top{fill:#d94b3d}.num{font:700 18px Consolas,monospace;fill:#f6f0e5}.h{font:700 24px Arial,"Microsoft YaHei",sans-serif;fill:#f6f0e5}.p{font:500 16px Arial,"Microsoft YaHei",sans-serif;fill:#c8d2d6}.note{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#182025}</style>
  <rect class="bg" width="1200" height="520" rx="24"/><rect class="paper" x="58" y="42" width="1084" height="52" rx="6"/><text x="84" y="75" class="note">证据升级 ≠ 自动越级｜STRUCTURE → CONTENT → REAL RESULT → ACCEPTANCE</text>
  <g transform="translate(90 325)"><rect class="step" width="245" height="125" rx="10"/><circle cx="32" cy="32" r="20" fill="#37a6b5"/><text x="32" y="38" text-anchor="middle" class="num">E1</text><text x="28" y="76" class="h">结构证据</text><text x="28" y="103" class="p">文件 · 字段 · 链接 · 依赖</text></g>
  <g transform="translate(345 250)"><rect class="step" width="245" height="200" rx="10"/><circle cx="32" cy="32" r="20" fill="#37a6b5"/><text x="32" y="38" text-anchor="middle" class="num">E2</text><text x="28" y="82" class="h">内容证据</text><text x="28" y="112" class="p">正文完整 · 可逐项判断</text><text x="28" y="142" class="p">不证明工具能执行</text></g>
  <g transform="translate(600 175)"><rect class="step" width="245" height="275" rx="10"/><circle cx="32" cy="32" r="20" fill="#f0643b"/><text x="32" y="38" text-anchor="middle" class="num">E3</text><text x="28" y="82" class="h">真实结果证据</text><text x="28" y="112" class="p">可运行 · 可观看 · 可试听</text><text x="28" y="142" class="p">逐图可见 · 全片回放</text><text x="28" y="172" class="p">仍不等于已经接受</text></g>
  <g transform="translate(855 100)"><rect class="top" width="245" height="350" rx="10"/><circle cx="32" cy="32" r="20" fill="#182025"/><text x="32" y="38" text-anchor="middle" class="num">E4</text><text x="28" y="82" class="h">接受证据</text><text x="28" y="112" class="p" style="fill:#fff">指定审阅者明确批准</text><text x="28" y="142" class="p" style="fill:#fff">采用 · 合并 · 正式晋级</text><path d="M28 190 H214" class="line" style="stroke:#fff;stroke-width:2"/><text x="28" y="226" class="p" style="fill:#fff">不证明永久稳定</text></g>
</svg>
