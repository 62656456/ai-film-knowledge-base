<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">拉片知识归属与验证流程</title><desc id="desc">从具体作品样本经过场景定位、机制解释、迁移规则和验证门，进入对应A、B知识卡或候选区。</desc><defs><style>.bg{fill:#11151a}.box{fill:#1b2128;stroke:#45505b;stroke-width:2}.t{fill:#e7e3da;font:700 24px 'Microsoft YaHei UI',sans-serif}.s{fill:#adb6c0;font:16px 'Microsoft YaHei UI',sans-serif}.a{stroke:#e5b454;stroke-width:4;fill:none;marker-end:url(#m)}.good{fill:#72b99a}.hold{fill:#9b90d7}.bad{fill:#d96b63}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e5b454"/></marker></defs><rect class="bg" width="1200" height="620"/><text class="t" x="45" y="52">拉片不建展馆：样本必须回到它解释的具体知识</text><text class="s" x="45" y="84">单片样本先做候选；只有机制清楚、边界明确并经重复验证，才进入正式理论。</text>
<g transform="translate(45 155)"><rect class="box" width="185" height="140"/><text class="t" x="20" y="38">1 具体样本</text><text class="s" x="20" y="75">作品 + 场景</text><text class="s" x="20" y="105">人物选择 + 时间点</text></g><path class="a" d="M230 225H285"/>
<g transform="translate(285 155)"><rect class="box" width="185" height="140"/><text class="t" x="20" y="38">2 机制解释</text><text class="s" x="20" y="75">改变了信息？</text><text class="s" x="20" y="105">关系、压力或节奏？</text></g><path class="a" d="M470 225H525"/>
<g transform="translate(525 155)"><rect class="box" width="185" height="140"/><text class="t" x="20" y="38">3 迁移规则</text><text class="s" x="20" y="75">脱离原作仍成立</text><text class="s" x="20" y="105">含正例、反例、边界</text></g><path class="a" d="M710 225H765"/>
<g transform="translate(765 155)"><rect class="box" width="185" height="140"/><text class="t" x="20" y="38">4 验证门</text><text class="s" x="20" y="75">多样本 / 实战回测</text><text class="s" x="20" y="105">反证与失效条件</text></g><path class="a" d="M950 225H1005"/>
<g transform="translate(1005 155)"><rect class="box" width="150" height="140"/><text class="t" x="20" y="38">5 唯一归属</text><text class="s" x="20" y="75">A1 摄影</text><text class="s" x="20" y="101">A2 导演</text><text class="s" x="20" y="127">A3 编剧 / B实战</text></g>
<g transform="translate(285 365)"><rect class="hold" width="315" height="62" rx="4"/><text class="t" x="22" y="39" fill="#11151a">证据不足 → 候选，不污染正式理论</text></g><path class="a" d="M860 295Q830 385 615 395"/><g transform="translate(665 455)"><rect class="good" width="490" height="62" rx="4"/><text class="t" x="22" y="39" fill="#11151a">验证通过 → 正文更新 + 所属组索引</text></g><text class="s" x="45" y="585">禁止路径：把单片截图堆成独立“拉片馆”，或从一个漂亮镜头直接推出普遍规律。</text></svg>
