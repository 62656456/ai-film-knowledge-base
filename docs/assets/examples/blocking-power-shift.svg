<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">场面调度中的权力转移</title><desc id="desc">三个连续俯视状态展示人物走位、摄影机位置和视线轴如何共同表达权力变化。</desc><defs><style>.bg{fill:#11151a}.room{fill:#1a2026;stroke:#4a5560;stroke-width:3}.t{fill:#e8e4da;font:700 25px 'Microsoft YaHei UI',sans-serif}.s{fill:#adb6c0;font:16px 'Microsoft YaHei UI',sans-serif}.a{fill:#76a9c7}.b{fill:#d96b63}.cam{fill:#e5b454}.axis{stroke:#77818d;stroke-dasharray:8 7;stroke-width:2}.move{stroke:#e5b454;stroke-width:4;fill:none;marker-end:url(#m)}.cone{fill:#e5b454;opacity:.12}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e5b454"/></marker></defs><rect class="bg" width="1200" height="620"/><text class="t" x="45" y="52">场面调度：权力变化必须在空间里发生</text><text class="s" x="45" y="84">同一房间、同一人物，通过站位、距离、遮挡与机位改变关系。</text>
<g transform="translate(40 125)"><text class="t" x="0" y="0">① 对峙</text><rect class="room" x="0" y="25" width="340" height="390"/><path class="axis" d="M65 220H275"/><circle class="a" cx="85" cy="220" r="24"/><text class="t" x="76" y="229">A</text><circle class="b" cx="255" cy="220" r="24"/><text class="t" x="246" y="229">B</text><path class="cone" d="M170 370L70 190H270Z"/><rect class="cam" x="150" y="355" width="40" height="27" rx="3"/><text class="s" x="18" y="445">同轴、等距：关系暂时均衡</text></g>
<g transform="translate(430 125)"><text class="t" x="0" y="0">② A 逼近</text><rect class="room" x="0" y="25" width="340" height="390"/><path class="axis" d="M65 220H275"/><circle class="a" cx="155" cy="220" r="24"/><text class="t" x="146" y="229">A</text><circle class="b" cx="255" cy="220" r="24"/><text class="t" x="246" y="229">B</text><path class="move" d="M85 220H125"/><path class="cone" d="M95 360L132 185L285 248Z"/><rect class="cam" x="75" y="345" width="40" height="27" rx="3"/><text class="s" x="18" y="445">距离压缩：A 主动施压，机位偏向 A</text></g>
<g transform="translate(820 125)"><text class="t" x="0" y="0">③ B 夺回空间</text><rect class="room" x="0" y="25" width="340" height="390"/><path class="axis" d="M75 125L260 285"/><circle class="a" cx="110" cy="165" r="24"/><text class="t" x="101" y="174">A</text><circle class="b" cx="240" cy="275" r="24"/><text class="t" x="231" y="284">B</text><path class="move" d="M260 220Q280 260 242 275"/><path class="cone" d="M285 90L80 145L145 250Z"/><rect class="cam" x="270" y="75" width="40" height="27" rx="3" transform="rotate(45 290 88)"/><text class="s" x="18" y="445">B 绕至纵深：轴线重建，权力反转</text></g>
<text class="s" x="45" y="595">调度检查：每次移动都应改变目标、阻力、遮挡或信息显露；只为“让画面动”不构成调度。</text></svg>

