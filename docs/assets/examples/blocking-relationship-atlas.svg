<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">影视人物关系站位三十型速览的十二种核心图解</title>
  <desc id="desc">完整知识卡列出三十型，本图选十二种核心俯视结构：中心支配、前近后远、群体孤立、门槛控制、换位反转、并肩同盟、正面对峙、三角中介、V形首领、半圆包围、纵深层级和中心空位。</desc>
  <defs>
    <style>
      .bg{fill:#101419}.card{fill:#1b2229;stroke:#3f4b56;stroke-width:2}.title{fill:#f0ede5;font:700 30px 'Microsoft YaHei UI',sans-serif}.sub{fill:#aeb8c2;font:17px 'Microsoft YaHei UI',sans-serif}.label{fill:#e8e4da;font:700 20px 'Microsoft YaHei UI',sans-serif}.note{fill:#9eabb7;font:15px 'Microsoft YaHei UI',sans-serif}.a{fill:#77aecd}.b{fill:#d96e66}.c{fill:#75b995}.g{fill:#79848f}.focus{stroke:#e7b65c;stroke-width:3;fill:none;stroke-dasharray:7 6}.axis{stroke:#66727e;stroke-width:2;stroke-dasharray:6 5}.wall{stroke:#87929d;stroke-width:8}.move{stroke:#e7b65c;stroke-width:4;fill:none;marker-end:url(#arrow)}.eye{stroke:#75b995;stroke-width:2;fill:none}.empty{fill:none;stroke:#e7b65c;stroke-width:3;stroke-dasharray:8 6}.txt{fill:#101419;font:700 15px 'Microsoft YaHei UI',sans-serif;text-anchor:middle;dominant-baseline:middle}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e7b65c"/></marker>
  </defs>
  <rect class="bg" width="1400" height="980"/>
  <text class="title" x="55" y="55">影视人物关系站位三十型速览｜十二种核心图解</text>
  <text class="sub" x="55" y="88">俯视图只记录空间真相；成片画面还要重新检查景别、遮挡、视线、焦点与画幅。</text>

  <g transform="translate(45 125)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">1 中心支配</text><circle class="focus" cx="155" cy="126" r="48"/><circle class="a" cx="155" cy="126" r="24"/><text class="txt" x="155" y="126">A</text><circle class="b" cx="76" cy="174" r="18"/><circle class="b" cx="234" cy="174" r="18"/><path class="eye" d="M88 168L132 138M222 168L178 138"/><text class="note" x="20" y="216">众人的视线和动作确认中心</text></g>
  <g transform="translate(380 125)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">2 前近后远</text><path class="axis" d="M155 54V200"/><circle class="a" cx="155" cy="155" r="34"/><text class="txt" x="155" y="155">A</text><circle class="b" cx="155" cy="80" r="17"/><text class="txt" x="155" y="80">B</text><text class="note" x="20" y="216">靠近镜头放大体量，也增加遮挡</text></g>
  <g transform="translate(715 125)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">3 群体与孤立者</text><circle class="b" cx="70" cy="105" r="18"/><circle class="b" cx="105" cy="140" r="18"/><circle class="b" cx="75" cy="173" r="18"/><circle class="a" cx="245" cy="137" r="24"/><text class="txt" x="245" y="137">A</text><path class="focus" d="M135 66V195"/><text class="note" x="20" y="216">空区把排斥关系变成可见事实</text></g>
  <g transform="translate(1050 125)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">4 门槛控制</text><path class="wall" d="M70 62V190M240 62V190"/><circle class="a" cx="155" cy="105" r="24"/><text class="txt" x="155" y="105">A</text><circle class="b" cx="155" cy="182" r="18"/><text class="txt" x="155" y="182">B</text><path class="eye" d="M155 160V132"/><text class="note" x="20" y="216">谁控制唯一通道，谁控制行动许可</text></g>

  <g transform="translate(45 385)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">5 换位反转</text><circle class="a" cx="90" cy="132" r="24"/><text class="txt" x="90" y="132">A</text><circle class="b" cx="220" cy="132" r="24"/><text class="txt" x="220" y="132">B</text><path class="move" d="M108 110Q155 65 202 110"/><path class="move" d="M202 156Q155 201 108 156"/><text class="note" x="20" y="216">跨越或绕行后，中心/前后必须改变</text></g>
  <g transform="translate(380 385)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">6 并肩同盟</text><circle class="a" cx="120" cy="145" r="24"/><text class="txt" x="120" y="145">A</text><circle class="b" cx="190" cy="145" r="24"/><text class="txt" x="190" y="145">B</text><path class="eye" d="M120 118L120 76M190 118L190 76"/><circle class="empty" cx="155" cy="70" r="27"/><text class="note" x="20" y="216">共享方向或目标，不等于机械站齐</text></g>
  <g transform="translate(715 385)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">7 正面对峙</text><path class="axis" d="M72 135H238"/><circle class="a" cx="95" cy="135" r="24"/><text class="txt" x="95" y="135">A</text><circle class="b" cx="215" cy="135" r="24"/><text class="txt" x="215" y="135">B</text><path class="eye" d="M122 135H188"/><text class="note" x="20" y="216">距离变化比对称本身更重要</text></g>
  <g transform="translate(1050 385)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">8 三角中介</text><path class="axis" d="M90 165L155 76L220 165Z"/><circle class="a" cx="90" cy="165" r="22"/><text class="txt" x="90" y="165">A</text><circle class="b" cx="220" cy="165" r="22"/><text class="txt" x="220" y="165">B</text><circle class="c" cx="155" cy="76" r="22"/><text class="txt" x="155" y="76">C</text><text class="note" x="20" y="216">第三人必须拥有调停、争夺或泄密权</text></g>

  <g transform="translate(45 645)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">9 V形首领</text><circle class="a" cx="155" cy="85" r="24"/><text class="txt" x="155" y="85">A</text><circle class="b" cx="95" cy="165" r="19"/><circle class="b" cx="215" cy="165" r="19"/><path class="axis" d="M95 165L155 85L215 165"/><text class="note" x="20" y="216">尖端负责方向，两翼负责支持或压力</text></g>
  <g transform="translate(380 645)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">10 半圆包围</text><circle class="a" cx="155" cy="155" r="23"/><text class="txt" x="155" y="155">A</text><circle class="b" cx="75" cy="110" r="18"/><circle class="b" cx="115" cy="72" r="18"/><circle class="b" cx="195" cy="72" r="18"/><circle class="b" cx="235" cy="110" r="18"/><path class="focus" d="M58 126Q155 28 252 126"/><text class="note" x="20" y="216">弧形应有行动压力，不能像合影</text></g>
  <g transform="translate(715 645)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">11 纵深层级</text><circle class="a" cx="155" cy="170" r="32"/><text class="txt" x="155" y="170">A</text><circle class="b" cx="105" cy="118" r="22"/><text class="txt" x="105" y="118">B</text><circle class="c" cx="195" cy="72" r="16"/><text class="txt" x="195" y="72">C</text><path class="eye" d="M135 150L116 135M122 105L181 80"/><text class="note" x="20" y="216">注意力按层传递，避免信息同时喊叫</text></g>
  <g transform="translate(1050 645)"><rect class="card" width="310" height="235" rx="14"/><text class="label" x="20" y="34">12 中心空位</text><circle class="empty" cx="155" cy="130" r="38"/><circle class="a" cx="80" cy="95" r="18"/><circle class="b" cx="230" cy="95" r="18"/><circle class="c" cx="95" cy="180" r="18"/><circle class="g" cx="215" cy="180" r="18"/><path class="eye" d="M97 104L128 119M213 104L182 119M112 171L130 149M198 171L180 149"/><text class="note" x="20" y="216">空座、缺席者或威胁必须被共同关注</text></g>

  <text class="sub" x="55" y="935">颜色只区分角色，不代表善恶或等级。任何站位都要通过目标、动作、反应和后果验证。</text>
</svg>
